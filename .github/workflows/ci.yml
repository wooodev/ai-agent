name: CI

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # data/raw와 .env는 저장소에 없다. data/sample/만으로 돌고, DB가 필요한 테스트는 건너뛴다
      - run: pytest -rs
