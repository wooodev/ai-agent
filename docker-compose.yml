services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      # db/init.sql이 reader 계정을 만들 때 읽는다
      READER_PASSWORD: ${READER_PASSWORD:?}
    ports:
      # scripts/load.py가 호스트에서 접속한다. 이 컴퓨터 밖으로는 열지 않는다
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    # API는 다음 단계에서 만든다. 지금은 reader 접속 정보만 받고 대기한다
    image: python:3.11-slim
    command: ["sleep", "infinity"]
    # sleep이 PID 1이면 SIGTERM을 무시해 종료가 10초 걸린다
    init: true
    environment:
      DATABASE_URL: postgresql://reader:${READER_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
